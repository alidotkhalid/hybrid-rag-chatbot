[project]
name = "hybrid-rag-chatbot"
version = "1.0.0"
description = "Hybrid retrieval (BM25 + dense) RAG chatbot with cross-encoder reranking and validated citations"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:importlib.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends/File/Form idiom requires calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path setup must precede imports in conftest
